[project]
name = "finalproject-maslov-m26-555"
version = "0.1.0"
description = "Консольное приложение-имитация валютного кошелька"
readme = "README.md"
authors = [
    { name = "sirAlexMaslovsonVG", email = "sirAlexMaslovsonVeryGood@yandex.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "prettytable>=3.10.0",
    "tomli>=2.5.0",
]

[project.scripts]
valutatrade-hub = "valutatrade_hub.__main__:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "valutatrade_hub"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.valutatrade]
data_dir = "data"
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
rates_ttl_seconds = 300
base_currency = "USD"
log_file = "logs/actions.log"
log_format = "text"
log_level = "INFO"
starting_usd_balance = 10000.0
